services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aquamine} -d $${POSTGRES_DB:-aquamine_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ./ai/Dockerfile
    volumes:
      - ./ai:/app/ai
    command: uvicorn ai.main:app --host 0.0.0.0 --port 8181 --reload
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      INGEST_API_KEY: ${INGEST_API_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_ISSUER: ${CLERK_ISSUER}
      NIXTLA_API_KEY: ${NIXTLA_API_KEY}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY}
      FONNTE_API_TOKEN: ${FONNTE_API_TOKEN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PYTHONPATH: /app
      MQTT_BROKER: ${MQTT_BROKER}
      MQTT_PORT: ${MQTT_PORT}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_TLS_INSECURE: ${MQTT_TLS_INSECURE}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mqtt-listener:
    build:
      context: .
      dockerfile: ./ai/Dockerfile
    entrypoint: ["python", "-m", "ai.iot.sensor_listener"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PYTHONPATH: /app
      MQTT_BROKER: ${MQTT_BROKER}
      MQTT_PORT: ${MQTT_PORT}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_TLS_INSECURE: ${MQTT_TLS_INSECURE}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      target: development
    volumes:
      - ./dashboard:/app
      - dashboard-node-modules:/app/node_modules
      - dashboard-next:/app/.next
      - dashboard-cache:/app/.cache
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

  simulator:
    build:
      context: .
      dockerfile: ./ai/Dockerfile
    container_name: aquamine-simulator
    volumes:
      - ./scripts:/app/scripts
      - ./ai:/app/ai
    command: >
      python -u /app/scripts/esp32_simulator.py
      --realtime
      --interval=60
      --scenario=auto
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_BASE_URL: http://api:8181
      INGEST_API_KEY: ${INGEST_API_KEY}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  dashboard-node-modules:
  dashboard-next:
  dashboard-cache:
