[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aquamine-ai"
version = "0.1.0"
description = "AquaMine AI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "cerebras_cloud_sdk>=1.0.0",
    "fastapi>=0.115.0",
    "faiss-cpu>=1.7.4",
    "nixtla>=0.6.0",
    "slowapi>=0.1.9",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "psycopg[binary]>=3.2.1",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.8",
    "resend>=2.0.0",
    "sentence-transformers>=2.2.2",
    "sqlalchemy>=2.0.32",
    "torch>=2.0.0",
    "ultralytics>=8.4.7",
    "uvicorn[standard]>=0.30.6",
    "pyjwt[crypto]>=2.11.0",
]

[tool.setuptools]
py-modules = ["ai"]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.3",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.22.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "greenlet>=3.3.0",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
]
