name: CI

'on':
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: aquamine
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: aquamine_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uv
        run: pip install uv
      
      - name: Install dependencies
        working-directory: ./ai
        run: uv pip install --system -e ".[dev]"
      
      - name: Run linting
        working-directory: ./ai
        run: ruff check .
      
      - name: Run tests
        working-directory: ./ai
        env:
          DATABASE_URL: postgresql+psycopg://aquamine:changeme@localhost:5432/aquamine_db
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      
      - name: Install dependencies
        working-directory: ./dashboard
        run: npm ci
      
      - name: Run lint
        working-directory: ./dashboard
        run: npm run lint || true
      
      - name: Build
        working-directory: ./dashboard
        if: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' }}
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: npm run build
 
      - name: Skip build (missing Clerk key)
        if: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY == '' }}
        run: |
          echo "::warning::Skipping dashboard build because secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is not set."
